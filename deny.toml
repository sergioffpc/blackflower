[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
disable-yank-checking = false
unmaintained = "all"
unsound = "all"
maximum-db-staleness = "P7D"
unused-ignored-advisory = "deny"
ignore = [
    # OpenEXR decoding uses exr -> pulp -> paste. The advisory reports that
    # paste is unmaintained, not vulnerable; remove this exception when pulp
    # replaces its feature-complete macro dependency.
    "RUSTSEC-2024-0436",
]

[licenses]
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
exceptions = [
    # Kira's optional real-time allocation assertion support uses this
    # single-clause BSD dependency.
    { allow = ["BSD-1-Clause"], crate = "assert_no_alloc" },
    # Kira uses triple_buffer to exchange mixer state without blocking the
    # audio callback. MPL-2.0 applies at the dependency file boundary.
    { allow = ["MPL-2.0"], crate = "triple_buffer" },
]
confidence-threshold = 0.93

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
skip = [
    { crate = "base64@0.13.1", reason = "gltf 1.4 still uses the pre-0.21 base64 API" },
    { crate = "bitflags@1.3.2", reason = "winit's Core Graphics dependency still uses bitflags 1" },
    { crate = "block2@0.5.1", reason = "winit's objc2 0.5 stack precedes the objc2 0.6 stack used by wgpu and audio" },
    { crate = "darling@0.21.3", reason = "deku derives used by SquashFS parsing have not moved to darling 0.23" },
    { crate = "darling_core@0.21.3", reason = "kept with the audited darling 0.21 derive stack" },
    { crate = "darling_macro@0.21.3", reason = "kept with the audited darling 0.21 derive stack" },
    { crate = "foldhash@0.1.5", reason = "petgraph in the pinned naga stack has not moved to foldhash 0.2" },
    { crate = "getrandom@0.2.17", reason = "ring retains the getrandom 0.2 API" },
    { crate = "getrandom@0.3.4", reason = "rand 0.9 users have not moved to the getrandom 0.4 API" },
    { crate = "hashbrown@0.15.5", reason = "petgraph in the pinned naga stack retains hashbrown 0.15" },
    { crate = "hashbrown@0.16.1", reason = "transitive consumers have not converged on hashbrown 0.17" },
    { crate = "itertools@0.13.0", reason = "bindgen retains itertools 0.13 while ratatui uses 0.14" },
    { crate = "jni-sys@0.3.1", reason = "winit and cpal retain the Android NDK stack built on jni-sys 0.3" },
    { crate = "linux-raw-sys@0.4.15", reason = "winit's Wayland stack retains rustix 0.38 and linux-raw-sys 0.4" },
    { crate = "objc2@0.5.2", reason = "winit has not converged with the objc2 0.6 stack used by wgpu and audio" },
    { crate = "objc2-foundation@0.2.2", reason = "winit has not converged with objc2-foundation 0.3" },
    { crate = "r-efi@5.3.0", reason = "getrandom 0.3 retains r-efi 5 while getrandom 0.4 uses r-efi 6" },
    { crate = "rand@0.9.5", reason = "transitive consumers have not converged on rand 0.10" },
    { crate = "rand_core@0.9.5", reason = "kept with the audited rand 0.9 dependency stack" },
    { crate = "redox_syscall@0.4.1", reason = "winit retains the Redox syscall 0.4 API" },
    { crate = "redox_syscall@0.5.18", reason = "parking_lot retains the Redox syscall 0.5 API" },
    { crate = "rustc-hash@1.1.0", reason = "the pinned naga stack retains rustc-hash 1" },
    { crate = "rustix@0.38.44", reason = "winit's Wayland stack retains rustix 0.38" },
    { crate = "shlex@1.3.0", reason = "bindgen retains shlex 1 while cc uses shlex 2" },
    { crate = "syn@2.0.119", reason = "transitive proc macros have not converged on syn 3" },
    { crate = "thiserror@1.0.69", reason = "winit and its platform stacks retain thiserror 1" },
    { crate = "thiserror-impl@1.0.69", reason = "kept with the audited thiserror 1 dependency stack" },
    { crate = "windows-sys@0.52.0", reason = "ring, rustix, winit, and Tracy retain windows-sys 0.52" },
    { crate = "windows-sys@0.60.2", reason = "notify retains windows-sys 0.60" },
    { crate = "windows-targets@0.52.6", reason = "the audited windows-sys 0.52 and Tracy stacks retain windows-targets 0.52" },
    { crate = "windows_aarch64_gnullvm@0.52.6", reason = "kept with the audited windows-targets 0.52 stack" },
    { crate = "windows_aarch64_msvc@0.52.6", reason = "kept with the audited windows-targets 0.52 stack" },
    { crate = "windows_i686_gnu@0.52.6", reason = "kept with the audited windows-targets 0.52 stack" },
    { crate = "windows_i686_gnullvm@0.52.6", reason = "kept with the audited windows-targets 0.52 stack" },
    { crate = "windows_i686_msvc@0.52.6", reason = "kept with the audited windows-targets 0.52 stack" },
    { crate = "windows_x86_64_gnu@0.52.6", reason = "kept with the audited windows-targets 0.52 stack" },
    { crate = "windows_x86_64_gnullvm@0.52.6", reason = "kept with the audited windows-targets 0.52 stack" },
    { crate = "windows_x86_64_msvc@0.52.6", reason = "kept with the audited windows-targets 0.52 stack" },
]

[bans.workspace-dependencies]
duplicates = "deny"
include-path-dependencies = true
unused = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
