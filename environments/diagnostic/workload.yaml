# Infrastructure evidence only; this is not the simulation server.
apiVersion: v1
kind: Namespace
metadata:
  name: blackflower-diagnostic
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: diagnostic
  namespace: blackflower-diagnostic
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: diagnostic
  template:
    metadata:
      labels:
        app: diagnostic
    spec:
      hostname: diagnostic-v1
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: diagnostic
          image: registry.k8s.io/e2e-test-images/agnhost@sha256:6e2eef87d0dc77e070a7549bc5fdfa290c0fefe3359eb33c2ad1eda692fe66a4
          args: [netexec, --udp-port=27015, --http-port=8080]
          ports:
            - name: diagnostic
              containerPort: 27015
              protocol: UDP
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: diagnostic
  namespace: blackflower-diagnostic
  annotations:
    metallb.io/address-pool: blackflower-lan
    external-dns.alpha.kubernetes.io/hostname: diagnostic.blackflower.home.arpa
    external-dns.alpha.kubernetes.io/ttl: '30'
    blackflower.io/dns: 'true'
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  externalTrafficPolicy: Local
  loadBalancerSourceRanges:
    - 192.168.86.0/24
  selector:
    app: diagnostic
  ports:
    - name: diagnostic
      port: 27015
      targetPort: diagnostic
      protocol: UDP
