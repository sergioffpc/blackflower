schema = 1

[scripting.luau]
optimization = "baseline"
debug = "full"
type_info = "native_modules"

[shaders]
target = "spirv"
capability = "spirv_1_5"
optimization = "none"
debug = "standard"

[textures]
ldr_encoding = "uastc"
hdr_encoding = "rgba16f"
quality = "fast"
zstd_level = 3
generate_mipmaps = true

[meshes]
lod_triangle_percents = [50, 25, 12]
lod_target_error = 0.01
optimize_overdraw = true
overdraw_threshold = 1.05
lock_borders = true

[animations]
sampling_rate_hz = 0.0
iframe_interval_seconds = 10.0
optimize = true
optimization_tolerance = 0.001
optimization_distance = 0.1
root_motion_tolerance = 0.001

[audio]
sample_rate = 48000

[acoustics]
sound_speed_meters_per_second = 343
max_receivers = 96
max_active_emissions = 512
max_candidate_pairs_per_tick = 4096
max_paths_per_pair = 4
max_transmission_surfaces = 8
max_client_voices = 128
reflections_crossfade_ms = 200
reflection_rays = 1024
diffuse_samples = 64
bounces = 4
simulated_duration_seconds = 1.0
saved_duration_seconds = 0.5
ambisonic_order = 1
bake_threads = 1
ray_batch_size = 64
irradiance_min_distance_meters = 0.1
bake_batch_size = 1
path_samples = 16
path_radius_meters = 0.5
path_visibility_threshold = 0.5
path_visibility_range_meters = 50.0
path_range_meters = 100.0
