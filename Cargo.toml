quinn = { version = "0.11.11", default-features = false, features = ["bloom", "runtime-tokio", "rustls-ring"] }
quote = { version = "1.0.47", default-features = false }
rcgen = { version = "0.14.8", default-features = false, features = ["crypto", "pem", "ring"] }
rubato = { version = "4.0.0", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
strum = { version = "0.28.0", default-features = false, features = ["derive"] }
syn = { version = "3.0.3", default-features = false, features = ["full", "parsing", "printing", "proc-macro"] }
tempfile = { version = "3.27.0", default-features = false }
thiserror = { version = "2.0.19", default-features = false }
toml = { version = "1.1.4+spec-1.1.0", default-features = false, features = ["display", "parse", "serde"] }
tracing = { version = "0.1.44", default-features = false, features = ["attributes", "release_max_level_info", "std"] }
tracing-appender = { version = "0.2.5", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "env-filter", "fmt", "json", "registry", "std"] }
