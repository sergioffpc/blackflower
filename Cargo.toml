blackflower-audio-voice = { path = "crates/blackflower-audio-voice" }
blackflower-cooker-animation = { path = "crates/blackflower-cooker-animation" }
blackflower-cooker-acoustics = { path = "crates/blackflower-cooker-acoustics" }
blackflower-cooker-navigation = { path = "crates/blackflower-cooker-navigation" }
