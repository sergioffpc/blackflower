[workspace]
resolver = "3"
members = [
    "apps/blackflower",
    "apps/blackflower-harness",
    "apps/blackflower-server",
    "crates/blackflower-animation",
    "crates/blackflower-assets",
    "crates/blackflower-audio",
    "crates/blackflower-audio-spatial",
    "crates/blackflower-audio-voice",
    "crates/blackflower-ecs",
    "crates/blackflower-ecs-derive",
    "crates/blackflower-gltf-metadata",
    "crates/blackflower-navigation",
    "crates/blackflower-networking",
    "crates/blackflower-observability",
    "crates/blackflower-physics",
    "crates/blackflower-prediction",
    "crates/blackflower-presentation",
    "crates/blackflower-rendering",
    "crates/blackflower-rendering-models",
    "crates/blackflower-rendering-textures",
    "crates/blackflower-rendering-volumes",
    "crates/blackflower-replication",
    "crates/blackflower-shader-compiler",
    "crates/blackflower-scripting",
    "crates/blackflower-simulation",
    "tools/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false

[workspace.dependencies]
blackflower-animation = { path = "crates/blackflower-animation" }
blackflower-assets = { path = "crates/blackflower-assets" }
blackflower-audio = { path = "crates/blackflower-audio" }
blackflower-audio-spatial = { path = "crates/blackflower-audio-spatial" }
blackflower-audio-voice = { path = "crates/blackflower-audio-voice" }
blackflower-ecs = { path = "crates/blackflower-ecs" }
blackflower-ecs-derive = { path = "crates/blackflower-ecs-derive" }
blackflower-gltf-metadata = { path = "crates/blackflower-gltf-metadata" }
blackflower-navigation = { path = "crates/blackflower-navigation" }
blackflower-networking = { path = "crates/blackflower-networking" }
blackflower-observability = { path = "crates/blackflower-observability" }
blackflower-physics = { path = "crates/blackflower-physics" }
blackflower-prediction = { path = "crates/blackflower-prediction" }
blackflower-presentation = { path = "crates/blackflower-presentation" }
blackflower-rendering = { path = "crates/blackflower-rendering" }
blackflower-rendering-models = { path = "crates/blackflower-rendering-models" }
blackflower-rendering-textures = { path = "crates/blackflower-rendering-textures" }
blackflower-rendering-volumes = { path = "crates/blackflower-rendering-volumes" }
blackflower-replication = { path = "crates/blackflower-replication" }
blackflower-shader-compiler = { path = "crates/blackflower-shader-compiler" }
blackflower-scripting = { path = "crates/blackflower-scripting" }
blackflower-simulation = { path = "crates/blackflower-simulation" }

anyhow = { version = "1.0.104", default-features = false, features = ["std"] }
backhand = { version = "0.25.1", default-features = false, features = ["zstd"] }
bindgen = { version = "0.72.1", default-features = false, features = ["runtime"] }
blake3 = { version = "1.8.5", default-features = false, features = ["std"] }
bytes = { version = "1.12.1", default-features = false }
bytemuck = { version = "1.25.2", default-features = false, features = ["derive"] }
cc = { version = "1.4.0", default-features = false }
clap = { version = "4.6.4", default-features = false, features = ["derive", "help", "std", "usage"] }
cmake = { version = "0.1.58", default-features = false }
ed25519-dalek = { version = "3.0.0", default-features = false }
glam = { version = "0.33.2", default-features = false, features = ["f64", "i32", "std"] }
gltf = { version = "=1.4.1", default-features = false, features = ["extensions", "extras", "import", "names", "utils", "KHR_materials_unlit", "KHR_texture_transform"] }
half = { version = "2.7.1", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["exr", "png"] }
metrics = { version = "0.24.6", default-features = false }
metrics-exporter-prometheus = { version = "0.18.3", default-features = false, features = ["http-listener"] }
meshopt = { version = "=0.6.2", default-features = false }
naga = { version = "=30.0.0", default-features = false, features = ["spv-in"] }
notify-debouncer-mini = { version = "0.7.0", default-features = false, features = ["macos_kqueue"] }
proc-macro2 = { version = "1.0.107", default-features = false }
profiling = { version = "1.0.18", default-features = false }
quote = { version = "1.0.47", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
strum = { version = "0.28.0", default-features = false, features = ["derive"] }
syn = { version = "3.0.3", default-features = false, features = ["full", "parsing", "printing", "proc-macro"] }
tempfile = { version = "3.27.0", default-features = false }
thiserror = { version = "2.0.19", default-features = false }
toml = { version = "1.1.4", default-features = false, features = ["parse", "serde"] }
tracing = { version = "0.1.44", default-features = false, features = ["attributes", "release_max_level_info", "std"] }
tracing-appender = { version = "0.2.5", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "env-filter", "fmt", "json", "registry", "std"] }
tracing-tracy = { version = "0.11.4", default-features = false }
urlencoding = { version = "2.1.3", default-features = false }
windows-sys = { version = "0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
# Baseline correctness, suspicious-code, style, complexity, and performance
# checks. The lower priority lets the project-specific rules below take
# precedence without triggering clippy::lint_groups_priority.
all = { level = "deny", priority = -1 }

# Runtime reliability. Long-running clients and authoritative servers must
# propagate failures instead of aborting or silently discarding them.
expect_used = "deny"
exit = "deny"
let_underscore_must_use = "deny"
map_err_ignore = "deny"
mem_forget = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
unused_result_ok = "deny"

# Numeric and simulation correctness. Networked state must not change through
# implicit truncation, wrapping, precision loss, or exact float comparisons.
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
float_cmp = "deny"
float_cmp_const = "deny"
lossy_float_literal = "deny"
unchecked_time_subtraction = "deny"

# Deterministic state and protocol handling. Iteration order and byte order
# must be explicit, and state-machine matches must account for every variant.
host_endian_bytes = "deny"
iter_over_hash_type = "deny"
wildcard_enum_match_arm = "deny"

# Maintainability and controlled escape hatches.
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
large_types_passed_by_value = "deny"
multiple_unsafe_ops_per_block = "deny"
should_panic_without_expect = "deny"
too_many_lines = "deny"
undocumented_unsafe_blocks = "deny"
