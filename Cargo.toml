    "crates/blackflower-audio-spatial",
    "crates/blackflower-audio-voice",
    "crates/blackflower-cooker-animation",
    "crates/blackflower-cooker-acoustics",
    "crates/blackflower-cooker-navigation",
    "crates/blackflower-cooker-volume",
    "crates/blackflower-destruction",
    "crates/blackflower-ecs",
    "crates/blackflower-ecs-derive",
    "crates/blackflower-gltf-metadata",
    "crates/blackflower-harness",
    "crates/blackflower-navigation",
    "crates/blackflower-networking",
    "crates/blackflower-networking-quic",
    "crates/blackflower-networking-replication",
    "crates/blackflower-observability",
