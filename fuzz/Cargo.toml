[package]
name = "blackflower-networking-fuzz"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
blackflower-animation-format = { path = "../crates/blackflower-animation-format" }
blackflower-networking = { path = "../crates/blackflower-networking" }
blackflower-networking-replication = { path = "../crates/blackflower-networking-replication" }
blackflower-rendering-models = { path = "../crates/blackflower-rendering-models" }

libfuzzer-sys = "0.4"

[[bin]]
name = "decode_wire"
path = "fuzz_targets/decode_wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "snapshot_reassembly"
path = "fuzz_targets/snapshot_reassembly.rs"
test = false
doc = false
bench = false

[[bin]]
name = "session_transitions"
path = "fuzz_targets/session_transitions.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_length_prefixed"
path = "fuzz_targets/decode_length_prefixed.rs"
test = false
doc = false
bench = false
