name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Validate commit messages
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]')
        env:
          BASE_OID: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_OID: ${{ github.event.pull_request.head.sha || github.sha }}
        run: .github/scripts/validate-commit-range.sh "$BASE_OID" "$HEAD_OID"

      - name: Set up Rust toolchain
        run: |
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version

      - name: Install libclang
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libclang-18-dev
          libclang_path=/usr/lib/llvm-18/lib
          test -f "$libclang_path/libclang.so"
          echo "LIBCLANG_PATH=$libclang_path" >> "$GITHUB_ENV"

      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml') }}-
            ${{ runner.os }}-cargo-

      - name: Run quality checks
        run: ./scripts/ci.sh

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Audit dependencies
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.97.1"
          command: check

  blackflower-ecs-native:
    name: blackflower-ecs (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out repository and Flecs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install libclang on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libclang-18-dev
          libclang_path=/usr/lib/llvm-18/lib
          test -f "$libclang_path/libclang.so"
          echo "LIBCLANG_PATH=$libclang_path" >> "$GITHUB_ENV"

      - name: Locate libclang on macOS
        if: runner.os == 'macOS'
        run: |
          libclang_path="$(brew --prefix llvm@18)/lib"
          test -f "$libclang_path/libclang.dylib"
          echo "LIBCLANG_PATH=$libclang_path" >> "$GITHUB_ENV"

      - name: Locate libclang on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $libclangPath = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path "$libclangPath\libclang.dll")) {
            throw "libclang.dll not found in $libclangPath"
          }
          "LIBCLANG_PATH=$libclangPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check observability feature combinations
        if: runner.os == 'Linux'
        run: |
          cargo check -p blackflower-ecs --no-default-features --locked
          cargo check -p blackflower-ecs --features metrics --locked
          cargo check -p blackflower-ecs --features tracing --locked

      - name: Run Clippy
        run: cargo clippy -p blackflower-ecs --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test -p blackflower-ecs --all-targets --all-features --locked --no-fail-fast

      - name: Run doctests
        run: cargo test -p blackflower-ecs --doc --all-features --locked
