name: Blackflower C++23 Build and Validation

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop, 'release/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Ubuntu 26.04 / ${{ matrix.preset }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, tsan, release]
    defaults:
      run:
        shell: bash
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      VCPKG_MAX_CONCURRENCY: '2'
    steps:
      - name: Configure Git initial branch
        run: git config --global init.defaultBranch main

      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Pull and verify the pinned development image
        run: |
          image=$(jq -er '.image | strings' .devcontainer/devcontainer.json)
          [[ "$image" =~ ^ghcr.io/sergioffpc/blackflower-devcontainer@sha256:[0-9a-f]{64}$ ]]
          docker pull "$image"
          expected=$(bash .devcontainer/image-inputs.sh)
          actual=$(docker image inspect "$image" \
            --format '{{index .Config.Labels "io.blackflower.devcontainer.inputs"}}')
          if [[ "$actual" != "$expected" ]]; then
            printf 'Image inputs changed; publish and pin a matching candidate.\n' >&2
            exit 1
          fi
          docker tag "$image" blackflower-dev:ci

      - name: Sign out of GHCR
        if: always()
        run: docker logout ghcr.io

      - name: Restore dependency download and compiler caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/container-cache
          key: devcontainer-assets-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'cmake/**', 'tools/content_pipeline/uv.lock', 'tools/code_quality/package-lock.json') }}
          restore-keys: |
            devcontainer-assets-${{ matrix.preset }}-

      - name: Start isolated validation container
        run: |
          mkdir -p build/container-cache
          docker run --detach --name blackflower-check --user root \
            --cap-add SYS_PTRACE --security-opt seccomp=unconfined \
            --env CMAKE_BUILD_PARALLEL_LEVEL --env VCPKG_MAX_CONCURRENCY \
            --mount "type=bind,source=$PWD,target=/workspaces/blackflower" \
            --mount "type=bind,source=$PWD/build/container-cache,target=/home/ubuntu/.cache" \
            --mount type=volume,target=/workspaces/blackflower/build \
            --mount type=volume,target=/workspaces/blackflower/tools/content_pipeline/.venv \
            --mount type=volume,target=/workspaces/blackflower/tools/code_quality/node_modules \
            blackflower-dev:ci

      - name: Prepare locked dependencies
        run: docker exec blackflower-check bash .devcontainer/prepare.sh "${{ matrix.preset }}"

      - name: Disconnect the build from the network
        run: docker network disconnect bridge blackflower-check

      - name: Build and check from a fresh directory offline
        run: docker exec blackflower-check bash .devcontainer/check.sh "${{ matrix.preset }}"

      - name: Collect container evidence
        if: always()
        run: |
          mkdir -p build/container-evidence
          docker image inspect blackflower-dev:ci > build/container-image.json
          docker cp blackflower-check:/workspaces/blackflower/build/. build/container-evidence/
          docker exec blackflower-check chown -R "$(id -u):$(id -g)" /home/ubuntu/.cache

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-${{ matrix.preset }}
          path: |
            build/container-image.json
            build/container-evidence/**/check.log
            build/container-evidence/**/Testing/Temporary/
            build/container-evidence/**/benchmarks.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Remove validation container and anonymous volumes
        if: always()
        run: docker rm --force --volumes blackflower-check
