name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Validate commit messages
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          BASE_OID: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_OID: ${{ github.event.pull_request.head.sha || github.sha }}
        run: .github/scripts/validate-commit-range.sh "$BASE_OID" "$HEAD_OID"

      - name: Set up Rust toolchain
        run: |
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version

      - name: Install libclang
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libclang-18-dev
          libclang_path=/usr/lib/llvm-18/lib
          test -f "$libclang_path/libclang.so"
          echo "LIBCLANG_PATH=$libclang_path" >> "$GITHUB_ENV"

      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml') }}-
            ${{ runner.os }}-cargo-

      - name: Run quality checks
        run: ./scripts/ci.sh

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Audit dependencies
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.97.1"
          command: check

  asset-pipeline:
    name: Asset pipeline (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Initialize asset compiler submodules
        run: |
          git submodule update --init --depth 1 crates/blackflower-scripting/vendor/luau
          git submodule update --init --depth 1 crates/blackflower-shader-compiler/vendor/slang
          git submodule update --init --depth 1 crates/blackflower-rendering-textures/vendor/KTX-Software
          git -C crates/blackflower-shader-compiler/vendor/slang submodule update --init --depth 1 external/cmark external/fast_float external/lz4 external/lua external/miniz external/spirv-headers external/unordered_dense external/vulkan

      - name: Set up Rust toolchain
        run: |
          rustc --version
          cargo --version
          cargo clippy --version

      - name: Install libclang on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libclang-18-dev
          libclang_path=/usr/lib/llvm-18/lib
          test -f "$libclang_path/libclang.so"
          echo "LIBCLANG_PATH=$libclang_path" >> "$GITHUB_ENV"

      - name: Locate libclang on macOS
        if: runner.os == 'macOS'
        run: |
          libclang_path="$(brew --prefix llvm@18)/lib"
          test -f "$libclang_path/libclang.dylib"
          echo "LIBCLANG_PATH=$libclang_path" >> "$GITHUB_ENV"

      - name: Locate libclang on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $libclangPath = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path "$libclangPath\libclang.dll")) {
            throw "libclang.dll not found in $libclangPath"
          }
          "LIBCLANG_PATH=$libclangPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-assets-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-assets-${{ hashFiles('rust-toolchain.toml') }}-
            ${{ runner.os }}-assets-

      - name: Run asset Clippy
        run: cargo clippy --package blackflower-assets --package blackflower-rendering-textures --package xtask --all-targets --all-features --locked -- -D warnings

      - name: Run asset tests and golden cook
        run: cargo test --package blackflower-assets --package blackflower-rendering-textures --package xtask --all-targets --all-features --locked --no-fail-fast

      - name: Run asset doctests
        run: cargo test --package blackflower-assets --package blackflower-rendering-textures --package xtask --doc --all-features --locked

  native-bindings:
    if: >-
      (github.event_name == 'pull_request' &&
      github.base_ref == 'main' &&
      (startsWith(github.head_ref, 'release/') ||
      startsWith(github.head_ref, 'hotfix/'))) ||
      (github.event_name == 'merge_group' &&
      github.event.merge_group.base_ref == 'refs/heads/main')
    name: ${{ matrix.package }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: blackflower-ecs
            os: ubuntu-24.04
          - package: blackflower-ecs
            os: macos-15
          - package: blackflower-ecs
            os: windows-2025
          - package: blackflower-physics
            os: ubuntu-24.04
          - package: blackflower-physics
            os: macos-15
          - package: blackflower-animation
            os: ubuntu-24.04
          - package: blackflower-animation
            os: macos-15
          - package: blackflower-animation
            os: windows-2025
          - package: blackflower-audio-spatial
            os: ubuntu-24.04
          - package: blackflower-audio-spatial
            os: macos-15
          - package: blackflower-audio-spatial
            os: windows-2025
          - package: blackflower-audio-voice
            os: ubuntu-24.04
          - package: blackflower-audio-voice
            os: macos-15
          - package: blackflower-audio-voice
            os: windows-2025
          - package: blackflower-navigation
            os: ubuntu-24.04
          - package: blackflower-navigation
            os: macos-15
          - package: blackflower-navigation
            os: windows-2025
          - package: blackflower-rendering-volumes
            os: ubuntu-24.04
          - package: blackflower-rendering-volumes
            os: macos-15
          - package: blackflower-rendering-volumes
            os: windows-2025
          - package: blackflower-rendering-textures
            os: ubuntu-24.04
          - package: blackflower-rendering-textures
            os: macos-15
          - package: blackflower-rendering-textures
            os: windows-2025
          - package: blackflower-scripting
            os: ubuntu-24.04
          - package: blackflower-scripting
            os: macos-15
          - package: blackflower-scripting
            os: windows-2025
          - package: blackflower-shader-compiler
            os: ubuntu-24.04
          - package: blackflower-shader-compiler
            os: macos-15
          - package: blackflower-shader-compiler
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Check out repository and native submodules
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install libclang on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libclang-18-dev
          libclang_path=/usr/lib/llvm-18/lib
          test -f "$libclang_path/libclang.so"
          echo "LIBCLANG_PATH=$libclang_path" >> "$GITHUB_ENV"

      - name: Locate libclang on macOS
        if: runner.os == 'macOS'
        run: |
          libclang_path="$(brew --prefix llvm@18)/lib"
          test -f "$libclang_path/libclang.dylib"
          echo "LIBCLANG_PATH=$libclang_path" >> "$GITHUB_ENV"

      - name: Locate libclang on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $libclangPath = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path "$libclangPath\libclang.dll")) {
            throw "libclang.dll not found in $libclangPath"
          }
          "LIBCLANG_PATH=$libclangPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check observability feature combinations
        if: runner.os == 'Linux' && matrix.package == 'blackflower-ecs'
        run: |
          cargo check -p blackflower-ecs --no-default-features --locked
          cargo check -p blackflower-ecs --features metrics --locked
          cargo check -p blackflower-ecs --features tracing --locked

      - name: Run Clippy
        run: cargo clippy -p ${{ matrix.package }} --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test -p ${{ matrix.package }} --all-targets --all-features --locked --no-fail-fast

      - name: Run doctests
        run: cargo test -p ${{ matrix.package }} --doc --all-features --locked

  native-bindings-result:
    if: >-
      always() &&
      ((github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'merge_group' &&
      github.event.merge_group.base_ref == 'refs/heads/main'))
    name: Native bindings
    needs:
      - native-bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Validate release branch
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            release/*|hotfix/*)
              ;;
            *)
              echo "Pull requests to main must come from a release/* or hotfix/* branch." >&2
              exit 1
              ;;
          esac

      - name: Require successful native bindings matrix
        env:
          MATRIX_RESULT: ${{ needs.native-bindings.result }}
        run: |
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "Native bindings matrix result: $MATRIX_RESULT" >&2
            exit 1
          fi
